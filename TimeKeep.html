<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TimeKeep">
<meta name="theme-color" content="#F5F7FB">
<title>TimeKeep — Edad & Tiempo de uso</title>
<style>

:root{--bg:#0E1117;--surface:#151A22;--surface2:#1B212B;--surface3:#222A36;--text:#F5F7FA;--text2:#B8C0CC;--muted:#7E8795;--line:#2B3442;--primary:#4F8CFF;--primary2:#7AA7FF;--primarySoft:#17243B;--shadow:0 14px 34px rgba(0,0,0,.28);--nav-h:76px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#0E1117;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}body{min-height:100dvh;background:linear-gradient(180deg,#0D1016 0%,#111722 100%)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}.topbar{position:sticky;top:0;z-index:50;padding:max(16px,env(safe-area-inset-top)) 18px 12px;background:rgba(14,17,23,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.05)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#4F8CFF;color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(79,140,255,.25)}.brandtext{font-weight:800;letter-spacing:-.4px;font-size:18px}.brandsub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:650}.version-badge{font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#8FB4FF;background:#17243B;border:1px solid #29436A;padding:4px 7px;border-radius:999px;margin-left:6px}.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#171D26;color:#D9E3F0;display:flex;align-items:center;justify-content:center}.content{padding:14px 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(135deg,#182131,#131922 70%);border:1px solid #263246;border-radius:22px;padding:18px 16px 16px;margin-bottom:12px;box-shadow:var(--shadow)}.hero-k{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#7FA7F7}.hero-title{font-size:25px;font-weight:800;letter-spacing:-1px;margin-top:5px}.hero-sub{font-size:11px;color:#A9B5C4;margin-top:6px;line-height:1.5}.pager{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.pageinfo{font-size:10px;font-weight:750;color:var(--muted)}.pagedots{display:flex;gap:5px;align-items:center}.pdot{width:6px;height:6px;border-radius:50%;background:#303B4B}.pdot.on{width:18px;border-radius:10px;background:#4F8CFF}.pager-actions{display:flex;gap:6px}.pager-btn{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:#171D26;color:#D0D7E1;font-size:18px;display:flex;align-items:center;justify-content:center}.dashboard-shell{height:calc(100dvh - 258px);min-height:480px;max-height:620px;position:relative}.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:100%}.age-card{background:linear-gradient(180deg,#171D26 0%,#141922 100%);border:1px solid #273243;border-radius:20px;padding:14px;box-shadow:0 10px 26px rgba(0,0,0,.18);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}.age-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cardInk,#4F8CFF)}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:relative;z-index:1}.card-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--cardSoft,#17243B);font-size:18px}.card-title{font-size:13px;font-weight:760;line-height:1.15;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}.card-date{font-size:9px;color:var(--muted);margin-top:4px;position:relative;z-index:1}.card-age{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:auto;position:relative;z-index:1}.age-part{background:#10151D;border:1px solid #232D3A;border-radius:11px;padding:8px 4px;text-align:center}.age-num{font-size:19px;font-weight:800;letter-spacing:-.8px;color:#fff}.age-label{font-size:7px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#667284;margin-top:2px}.card-foot{font-size:8.5px;color:#9AA6B5;margin-top:8px;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-menu{border:1px solid #2A3544;background:#111720;width:28px;height:28px;border-radius:9px;color:#8591A0;position:relative;z-index:2}.empty-slot{border:1px dashed #334052;border-radius:20px;background:#121821;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#738094}.empty-plus{font-size:24px;margin-bottom:6px}.empty-text{font-size:10px;line-height:1.4}.manage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.manage-title{font-size:24px;font-weight:800;letter-spacing:-.8px}.primary-btn{border:0;border-radius:13px;padding:11px 14px;background:#4F8CFF;color:#fff;font-weight:760;font-size:12px;box-shadow:0 8px 18px rgba(79,140,255,.22)}.item-list{display:flex;flex-direction:column;gap:8px}.item-row{background:#151B24;border:1px solid #273243;border-radius:17px;padding:12px;display:flex;align-items:center;gap:11px}.item-icon{width:40px;height:40px;border-radius:12px;background:#17243B;display:flex;align-items:center;justify-content:center;font-size:19px}.item-main{flex:1;min-width:0}.item-name{font-size:13px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{font-size:10px;color:var(--muted);margin-top:2px}.item-actions{display:flex;gap:5px}.mini-btn{width:30px;height:30px;border-radius:9px;border:1px solid #2A3544;background:#10161E;color:#B3BDCA}.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:100;width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:7px 12px env(safe-area-inset-bottom);background:rgba(12,16,22,.97);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid #202A37;display:grid;grid-template-columns:1fr 1fr;gap:8px}.navbtn{border:0;background:transparent;border-radius:13px;color:#717D8D;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}.navbtn.on{background:#17243B;color:#8FB4FF}.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center}.modal-overlay.on{display:flex}.sheet{width:100%;max-width:480px;background:#121821;border-radius:26px 26px 0 0;max-height:90dvh;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.42);border-top:1px solid #293546}.handle{width:34px;height:4px;border-radius:2px;background:#3A4656;margin:2px auto 18px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheet-title{font-size:22px;font-weight:800;letter-spacing:-.6px}.close-x{width:36px;height:36px;border-radius:50%;border:1px solid #2B3747;background:#171D26;color:#C6CED9;font-size:24px}.form-group{margin-top:14px}.form-label{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#758194;margin-bottom:6px;display:block}.field{width:100%;border:1px solid #2A3544;background:#0F141B;color:#F5F7FA;border-radius:12px;padding:12px 13px;outline:none}.field:focus{border-color:#4F8CFF;box-shadow:0 0 0 3px rgba(79,140,255,.12)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.icon-opt{height:36px;border:1px solid #293546;background:#111720;border-radius:10px;font-size:17px}.icon-opt.on{background:#17243B;border-color:#4F8CFF}.color-grid{display:flex;gap:8px;flex-wrap:wrap}.color-opt{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.color-opt.on{outline:2px solid #0F141B;box-shadow:0 0 0 3px #4F8CFF}.sheet-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:20px}.secondary-btn{border:1px solid #2A3544;background:#171D26;color:#C8D0DA;border-radius:13px;padding:13px;font-weight:700}.save-btn{border:0;background:#4F8CFF;color:#fff;border-radius:13px;padding:13px;font-weight:760}.danger-btn{width:100%;border:1px solid #5A313A;background:#24161A;color:#E78B9A;border-radius:13px;padding:12px;font-weight:700;margin-top:8px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:1000;background:#EAF1FF;color:#173A70;border-radius:999px;padding:10px 16px;font-size:11px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(-3px)}@media(max-width:390px){.dashboard-shell{height:calc(100dvh - 244px);min-height:450px}.age-card{padding:12px}.age-num{font-size:17px}.card-title{font-size:12px}}

</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="toprow"><div class="brand"><div class="brandmark">T</div><div><div class="brandtext">TimeKeep <span class="version-badge">V3</span></div><div class="brandsub">Edad & tiempo de uso</div></div></div><button class="iconbtn" onclick="openEditor()">＋</button></div></header>
<main class="content">
<section class="view active" id="view-dashboard">
<div class="hero"><div class="hero-k">Tu línea de tiempo</div><div class="hero-title">Tu tiempo, en una sola vista</div><div class="hero-sub">Cada tarjeta calcula automáticamente años, meses y días desde la fecha que definas.</div></div>
<div class="pager"><div><div class="pageinfo" id="pageInfo">Página 1 de 1</div><div class="pagedots" id="pageDots"></div></div><div class="pager-actions"><button class="pager-btn" onclick="changePage(-1)">‹</button><button class="pager-btn" onclick="changePage(1)">›</button></div></div>
<div class="dashboard-shell" id="dashboardTouch"><div class="dashboard-grid" id="dashboardGrid"></div></div>
</section>
<section class="view" id="view-manage"><div class="manage-head"><div><div class="hero-k">Administrar</div><div class="manage-title">Tus contadores</div></div><button class="primary-btn" onclick="openEditor()">+ Agregar</button></div><div class="item-list" id="itemList"></div></section>
</main>
<nav class="bottom-nav"><button class="navbtn on" id="nav-dashboard" onclick="switchView('dashboard')">◫ Dashboard</button><button class="navbtn" id="nav-manage" onclick="switchView('manage')">✎ Editar</button></nav>
</div>
<div class="modal-overlay" id="editorOverlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><div class="sheet-title" id="sheetTitle">Nuevo contador</div><button class="close-x" onclick="closeEditor()">×</button></div><input type="hidden" id="editId"><div class="form-group"><label class="form-label">Nombre</label><input class="field" id="itemName" maxlength="40" placeholder="Ej. Troy, Ford Territory, MacBook..."></div><div class="form-row"><div class="form-group"><label class="form-label">Fecha inicial</label><input class="field" id="itemDate" type="date"></div><div class="form-group"><label class="form-label">Tipo</label><select class="field" id="itemType"><option value="Edad">Edad</option><option value="Uso">Tiempo de uso</option><option value="Propiedad">Tiempo conmigo</option><option value="Otro">Otro</option></select></div></div><div class="form-group"><label class="form-label">Icono</label><div class="icon-grid" id="iconGrid"></div></div><div class="form-group"><label class="form-label">Acento</label><div class="color-grid" id="colorGrid"></div></div><div class="form-group"><label class="form-label">Nota opcional</label><input class="field" id="itemNote" maxlength="70" placeholder="Ej. Comprado nuevo, fecha de adopción..."></div><div class="sheet-actions"><button class="secondary-btn" onclick="closeEditor()">Cancelar</button><button class="save-btn" onclick="saveItem()">Guardar</button></div><button class="danger-btn" id="deleteBtn" style="display:none" onclick="deleteCurrent()">Eliminar contador</button></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='timekeep_items_v1';const ICONS=['🎂','🐶','🚗','💻','📱','⌚','📷','🏠','🛵','🎸','🏃','💼','💍','🌱','✈️','⭐'];const COLORS=[
  {id:'blue',soft:'#17243B',ink:'#4F8CFF'},
  {id:'mint',soft:'#19362F',ink:'#6DD3B1'},
  {id:'violet',soft:'#29233B',ink:'#B3A0FF'},
  {id:'amber',soft:'#3A2F1B',ink:'#E2B866'},
  {id:'rose',soft:'#39252B',ink:'#E891A1'},
  {id:'steel',soft:'#222B36',ink:'#91A2B7'}
];let items=[],currentPage=0,selectedIcon='🎂',selectedColor='blue';
function uid(){return'tk_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function localISO(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parseLocalDate(s){const p=String(s||'').split('-').map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2],12):null}function saveDisk(){localStorage.setItem(KEY,JSON.stringify(items))}function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}if(!Array.isArray(items))items=[];if(!items.length){const n=new Date();items=[{id:uid(),name:'Ejemplo 1',date:localISO(new Date(n.getFullYear()-1,n.getMonth(),n.getDate())),type:'Edad',icon:'🎂',color:'blue',note:''},{id:uid(),name:'Ejemplo 2',date:localISO(new Date(n.getFullYear(),n.getMonth()-8,n.getDate())),type:'Uso',icon:'📱',color:'mint',note:''},{id:uid(),name:'Ejemplo 3',date:localISO(new Date(n.getFullYear()-2,n.getMonth(),n.getDate())),type:'Uso',icon:'🚗',color:'violet',note:''},{id:uid(),name:'Ejemplo 4',date:localISO(new Date(n.getFullYear(),n.getMonth()-3,n.getDate())),type:'Uso',icon:'💻',color:'amber',note:''}];saveDisk()}}
function ageYMD(s,end=new Date()){const start=parseLocalDate(s);if(!start||start>end)return{years:0,months:0,days:0};let y=end.getFullYear()-start.getFullYear(),m=end.getMonth()-start.getMonth(),d=end.getDate()-start.getDate();if(d<0){m--;d+=new Date(end.getFullYear(),end.getMonth(),0).getDate()}if(m<0){y--;m+=12}return{years:y,months:m,days:d}}function colorObj(id){const legacy={navy:'blue',sage:'mint',plum:'violet',sand:'amber',stone:'rose',graphite:'steel',lav:'violet',coral:'rose',sky:'steel'};id=legacy[id]||id;return COLORS.find(c=>c.id===id)||COLORS[0]}function fmtDate(s){const d=parseLocalDate(s);return d?d.toLocaleDateString('es-CR',{day:'2-digit',month:'short',year:'numeric'}):'—'}function nextAnniversary(item){const s=parseLocalDate(item.date);if(!s)return'';const now=new Date();let n=new Date(now.getFullYear(),s.getMonth(),s.getDate(),12);const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);if(n<t)n.setFullYear(n.getFullYear()+1);const days=Math.ceil((n-t)/86400000);return days===0?'Aniversario hoy':days===1?'Próximo aniversario mañana':'Próximo aniversario en '+days+' días'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderDashboard(){const g=document.getElementById('dashboardGrid'),pages=Math.max(1,Math.ceil(items.length/4));if(currentPage>=pages)currentPage=pages-1;const slice=items.slice(currentPage*4,currentPage*4+4);let h='';slice.forEach(item=>{const a=ageYMD(item.date),c=colorObj(item.color);h+=`<article class="age-card" style="--cardSoft:${c.soft};--cardInk:${c.ink}"><div class="card-top"><div class="card-icon">${item.icon||'⏳'}</div><button class="card-menu" onclick="openEditor('${item.id}')">•••</button></div><div class="card-title">${esc(item.name)}</div><div class="card-date">${esc(item.type||'Edad')} · ${fmtDate(item.date)}</div><div class="card-age"><div class="age-part"><div class="age-num">${a.years}</div><div class="age-label">Años</div></div><div class="age-part"><div class="age-num">${a.months}</div><div class="age-label">Meses</div></div><div class="age-part"><div class="age-num">${a.days}</div><div class="age-label">Días</div></div></div><div class="card-foot">${item.note?esc(item.note):nextAnniversary(item)}</div></article>`});for(let i=slice.length;i<4;i++)h+=`<button class="empty-slot" onclick="openEditor()"><div><div class="empty-plus">＋</div><div class="empty-text">Agregar contador</div></div></button>`;g.innerHTML=h;document.getElementById('pageInfo').textContent=`Página ${currentPage+1} de ${pages} · ${items.length} contador${items.length===1?'':'es'}`;document.getElementById('pageDots').innerHTML=Array.from({length:pages},(_,i)=>`<span class="pdot ${i===currentPage?'on':''}"></span>`).join('')}
function renderList(){const e=document.getElementById('itemList');e.innerHTML=items.length?items.map(item=>{const a=ageYMD(item.date),c=colorObj(item.color);return`<div class="item-row"><div class="item-icon" style="background:${c.soft}">${item.icon}</div><div class="item-main"><div class="item-name">${esc(item.name)}</div><div class="item-meta">${a.years}a ${a.months}m ${a.days}d · ${fmtDate(item.date)}</div></div><div class="item-actions"><button class="mini-btn" onclick="openEditor('${item.id}')">✎</button><button class="mini-btn" onclick="deleteItem('${item.id}')">×</button></div></div>`}).join(''):'<button class="empty-slot" style="min-height:150px;width:100%" onclick="openEditor()"><div><div class="empty-plus">＋</div><div class="empty-text">Agrega tu primer contador</div></div></button>'}function render(){renderDashboard();renderList()}function changePage(d){const p=Math.max(1,Math.ceil(items.length/4));currentPage=(currentPage+d+p)%p;renderDashboard()}function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('on'));document.getElementById('nav-'+v).classList.add('on');v==='dashboard'?renderDashboard():renderList()}
function renderPickers(){document.getElementById('iconGrid').innerHTML=ICONS.map(i=>`<button type="button" class="icon-opt ${i===selectedIcon?'on':''}" onclick="selectedIcon='${i}';renderPickers()">${i}</button>`).join('');document.getElementById('colorGrid').innerHTML=COLORS.map(c=>`<button type="button" class="color-opt ${c.id===selectedColor?'on':''}" style="background:${c.soft}" onclick="selectedColor='${c.id}';renderPickers()"></button>`).join('')}function openEditor(id){const item=id?items.find(x=>x.id===id):null;document.getElementById('editId').value=item?item.id:'';document.getElementById('sheetTitle').textContent=item?'Editar contador':'Nuevo contador';document.getElementById('itemName').value=item?item.name:'';document.getElementById('itemDate').value=item?item.date:localISO();document.getElementById('itemType').value=item?(item.type||'Edad'):'Edad';document.getElementById('itemNote').value=item?(item.note||''):'';selectedIcon=item?(item.icon||'🎂'):'🎂';selectedColor=item?(item.color||'blue'):'blue';document.getElementById('deleteBtn').style.display=item?'block':'none';renderPickers();document.getElementById('editorOverlay').classList.add('on')}function closeEditor(){document.getElementById('editorOverlay').classList.remove('on')}function saveItem(){const id=document.getElementById('editId').value,name=document.getElementById('itemName').value.trim(),date=document.getElementById('itemDate').value;if(!name)return toast('Agrega un nombre');if(!date)return toast('Selecciona una fecha');if(parseLocalDate(date)>new Date())return toast('La fecha no puede estar en el futuro');const o={id:id||uid(),name,date,type:document.getElementById('itemType').value,icon:selectedIcon,color:selectedColor,note:document.getElementById('itemNote').value.trim()};if(id){const i=items.findIndex(x=>x.id===id);if(i>=0)items[i]=o}else items.push(o);saveDisk();closeEditor();render();toast(id?'Actualizado':'Agregado')}function deleteCurrent(){const id=document.getElementById('editId').value;if(id)deleteItem(id,true)}function deleteItem(id,modal=false){const it=items.find(x=>x.id===id);if(!it)return;if(!confirm(`¿Eliminar "${it.name}"?`))return;items=items.filter(x=>x.id!==id);saveDisk();if(modal)closeEditor();render();toast('Eliminado')}let tm;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('show'),2200)}document.getElementById('editorOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditor()});let sx=0,sy=0;const touch=document.getElementById('dashboardTouch');touch.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});touch.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)changePage(dx<0?1:-1)},{passive:true});setInterval(renderDashboard,60000);load();render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TimeKeep">
<meta name="theme-color" content="#F5F7FB">
<title>TimeKeep — Edad & Tiempo de uso</title>
<style>
:root{--bg:#F5F7FB;--surface:#fff;--surface2:#EEF3F9;--text:#172033;--text2:#536178;--muted:#8A96A8;--line:#E0E7F0;--primary:#789FE8;--primary2:#647FD0;--primarySoft:#E7EEFC;--shadow:0 12px 34px rgba(47,66,94,.08);--nav-h:76px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 100% 0%,rgba(120,159,232,.16),transparent 28%),radial-gradient(circle at 0% 46%,rgba(148,199,181,.11),transparent 28%),var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:0 auto;min-height:100dvh}.topbar{position:sticky;top:0;z-index:50;padding:max(16px,env(safe-area-inset-top)) 18px 12px;background:rgba(245,247,251,.86);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid rgba(87,108,141,.06)}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brandmark{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7EA4EC,#8E86D8);color:#fff;font-weight:800;box-shadow:0 8px 18px rgba(98,123,190,.24)}.brandtext{font-weight:800;letter-spacing:-.4px;font-size:18px}.brandsub{font-size:10px;color:var(--muted);margin-top:1px;font-weight:650}.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.76);color:var(--text2);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(47,66,94,.05)}.content{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(145deg,#fff,#F4F7FC);border:1px solid var(--line);border-radius:26px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}.hero-k{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}.hero-title{font-size:25px;font-weight:820;letter-spacing:-1px;margin-top:5px}.hero-sub{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.45}.pager{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.pageinfo{font-size:10px;font-weight:750;color:var(--muted)}.pagedots{display:flex;gap:5px}.pdot{width:6px;height:6px;border-radius:50%;background:#D6DFEB}.pdot.on{width:18px;border-radius:10px;background:var(--primary)}.pager-actions{display:flex;gap:6px}.pager-btn{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.8);color:var(--text2);font-size:18px}.dashboard-shell{height:calc(100dvh - 258px);min-height:480px;max-height:620px}.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:100%}.age-card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 10px 26px rgba(47,66,94,.055);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}.age-card::after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-32px;top:-34px;background:var(--cardSoft,#E7EEFC);opacity:.68}.card-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}.card-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--cardSoft,#E7EEFC);font-size:18px}.card-menu{border:0;background:rgba(255,255,255,.7);width:28px;height:28px;border-radius:9px;color:var(--muted);position:relative;z-index:2}.card-title{font-size:13px;font-weight:780;line-height:1.15;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}.card-date{font-size:9px;color:var(--muted);margin-top:3px;position:relative;z-index:1}.card-age{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:auto;position:relative;z-index:1}.age-part{background:var(--surface2);border-radius:12px;padding:8px 4px;text-align:center}.age-num{font-size:19px;font-weight:820;letter-spacing:-.8px}.age-label{font-size:7px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-top:2px}.card-foot{font-size:8.5px;color:var(--text2);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}.empty-slot{border:1px dashed #CFD9E6;border-radius:22px;background:rgba(255,255,255,.42);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--muted)}.empty-plus{font-size:24px;margin-bottom:6px}.empty-text{font-size:10px}.manage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.manage-title{font-size:24px;font-weight:820;letter-spacing:-.8px}.primary-btn{border:0;border-radius:14px;padding:11px 14px;background:linear-gradient(135deg,#789FE8,#7A79CF);color:#fff;font-weight:760;font-size:12px;box-shadow:0 8px 18px rgba(99,123,190,.2)}.item-list{display:flex;flex-direction:column;gap:8px}.item-row{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:11px;box-shadow:0 7px 20px rgba(47,66,94,.045)}.item-icon{width:40px;height:40px;border-radius:13px;background:var(--primarySoft);display:flex;align-items:center;justify-content:center;font-size:19px}.item-main{flex:1;min-width:0}.item-name{font-size:13px;font-weight:760}.item-meta{font-size:10px;color:var(--muted);margin-top:2px}.item-actions{display:flex;gap:5px}.mini-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text2)}.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:100;width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:7px 12px env(safe-area-inset-bottom);background:rgba(250,252,255,.94);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.navbtn{border:0;background:transparent;border-radius:14px;color:var(--muted);font-size:11px;font-weight:700}.navbtn.on{background:var(--primarySoft);color:var(--primary2)}.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(29,40,58,.32);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);display:none;align-items:flex-end;justify-content:center}.modal-overlay.on{display:flex}.sheet{width:100%;max-width:480px;background:#F9FBFD;border-radius:28px 28px 0 0;max-height:90dvh;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(35,49,70,.18)}.handle{width:34px;height:4px;border-radius:2px;background:#CCD5E1;margin:2px auto 18px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-title{font-size:22px;font-weight:820}.close-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--text2);font-size:24px}.form-group{margin-top:14px}.form-label{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}.field{width:100%;border:1px solid #DCE4EE;background:#fff;color:var(--text);border-radius:13px;padding:12px 13px;outline:none}.field:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(120,159,232,.1)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.icon-opt{height:36px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px}.icon-opt.on{background:var(--primarySoft);border-color:#B8CAF0}.color-grid{display:flex;gap:8px;flex-wrap:wrap}.color-opt{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.color-opt.on{outline:2px solid #fff;box-shadow:0 0 0 3px var(--primary)}.sheet-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:20px}.secondary-btn{border:1px solid var(--line);background:#fff;color:var(--text2);border-radius:14px;padding:13px;font-weight:700}.save-btn{border:0;background:linear-gradient(135deg,#789FE8,#7A79CF);color:#fff;border-radius:14px;padding:13px;font-weight:760}.danger-btn{width:100%;border:1px solid #F0D7DB;background:#FFF4F5;color:#C96F7A;border-radius:14px;padding:12px;font-weight:700;margin-top:8px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:1000;background:#26364E;color:#fff;border-radius:999px;padding:10px 16px;font-size:11px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(-3px)}@media(max-width:390px){.dashboard-shell{height:calc(100dvh - 244px);min-height:450px}.age-card{padding:12px}.age-num{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="toprow"><div class="brand"><div class="brandmark">⌛</div><div><div class="brandtext">TimeKeep</div><div class="brandsub">Edad & tiempo de uso</div></div></div><button class="iconbtn" onclick="openEditor()">＋</button></div></header>
<main class="content">
<section class="view active" id="view-dashboard">
<div class="hero"><div class="hero-k">Tu línea de tiempo</div><div class="hero-title">Todo lo importante, en una vista</div><div class="hero-sub">Cada tarjeta calcula automáticamente años, meses y días desde la fecha que definas.</div></div>
<div class="pager"><div><div class="pageinfo" id="pageInfo">Página 1 de 1</div><div class="pagedots" id="pageDots"></div></div><div class="pager-actions"><button class="pager-btn" onclick="changePage(-1)">‹</button><button class="pager-btn" onclick="changePage(1)">›</button></div></div>
<div class="dashboard-shell" id="dashboardTouch"><div class="dashboard-grid" id="dashboardGrid"></div></div>
</section>
<section class="view" id="view-manage"><div class="manage-head"><div><div class="hero-k">Administrar</div><div class="manage-title">Tus contadores</div></div><button class="primary-btn" onclick="openEditor()">+ Agregar</button></div><div class="item-list" id="itemList"></div></section>
</main>
<nav class="bottom-nav"><button class="navbtn on" id="nav-dashboard" onclick="switchView('dashboard')">◫ Dashboard</button><button class="navbtn" id="nav-manage" onclick="switchView('manage')">✎ Editar</button></nav>
</div>
<div class="modal-overlay" id="editorOverlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><div class="sheet-title" id="sheetTitle">Nuevo contador</div><button class="close-x" onclick="closeEditor()">×</button></div><input type="hidden" id="editId"><div class="form-group"><label class="form-label">Nombre</label><input class="field" id="itemName" maxlength="40" placeholder="Ej. Troy, Ford Territory, MacBook..."></div><div class="form-row"><div class="form-group"><label class="form-label">Fecha inicial</label><input class="field" id="itemDate" type="date"></div><div class="form-group"><label class="form-label">Tipo</label><select class="field" id="itemType"><option value="Edad">Edad</option><option value="Uso">Tiempo de uso</option><option value="Propiedad">Tiempo conmigo</option><option value="Otro">Otro</option></select></div></div><div class="form-group"><label class="form-label">Icono</label><div class="icon-grid" id="iconGrid"></div></div><div class="form-group"><label class="form-label">Acento</label><div class="color-grid" id="colorGrid"></div></div><div class="form-group"><label class="form-label">Nota opcional</label><input class="field" id="itemNote" maxlength="70" placeholder="Ej. Comprado nuevo, fecha de adopción..."></div><div class="sheet-actions"><button class="secondary-btn" onclick="closeEditor()">Cancelar</button><button class="save-btn" onclick="saveItem()">Guardar</button></div><button class="danger-btn" id="deleteBtn" style="display:none" onclick="deleteCurrent()">Eliminar contador</button></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='timekeep_items_v1';const ICONS=['🎂','🐶','🚗','💻','📱','⌚','📷','🏠','🛵','🎸','🏃','💼','💍','🌱','✈️','⭐'];const COLORS=[{id:'blue',soft:'#E7EEFC'},{id:'mint',soft:'#DFF1E9'},{id:'lav',soft:'#ECE7F8'},{id:'amber',soft:'#F4EACF'},{id:'coral',soft:'#F5E2E6'},{id:'sky',soft:'#E2F1F7'}];let items=[],currentPage=0,selectedIcon='🎂',selectedColor='blue';
function uid(){return'tk_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function localISO(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parseLocalDate(s){const p=String(s||'').split('-').map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2],12):null}function saveDisk(){localStorage.setItem(KEY,JSON.stringify(items))}function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}if(!Array.isArray(items))items=[];if(!items.length){const n=new Date();items=[{id:uid(),name:'Ejemplo 1',date:localISO(new Date(n.getFullYear()-1,n.getMonth(),n.getDate())),type:'Edad',icon:'🎂',color:'blue',note:''},{id:uid(),name:'Ejemplo 2',date:localISO(new Date(n.getFullYear(),n.getMonth()-8,n.getDate())),type:'Uso',icon:'📱',color:'mint',note:''},{id:uid(),name:'Ejemplo 3',date:localISO(new Date(n.getFullYear()-2,n.getMonth(),n.getDate())),type:'Uso',icon:'🚗',color:'lav',note:''},{id:uid(),name:'Ejemplo 4',date:localISO(new Date(n.getFullYear(),n.getMonth()-3,n.getDate())),type:'Uso',icon:'💻',color:'amber',note:''}];saveDisk()}}
function ageYMD(s,end=new Date()){const start=parseLocalDate(s);if(!start||start>end)return{years:0,months:0,days:0};let y=end.getFullYear()-start.getFullYear(),m=end.getMonth()-start.getMonth(),d=end.getDate()-start.getDate();if(d<0){m--;d+=new Date(end.getFullYear(),end.getMonth(),0).getDate()}if(m<0){y--;m+=12}return{years:y,months:m,days:d}}function colorObj(id){return COLORS.find(c=>c.id===id)||COLORS[0]}function fmtDate(s){const d=parseLocalDate(s);return d?d.toLocaleDateString('es-CR',{day:'2-digit',month:'short',year:'numeric'}):'—'}function nextAnniversary(item){const s=parseLocalDate(item.date);if(!s)return'';const now=new Date();let n=new Date(now.getFullYear(),s.getMonth(),s.getDate(),12);const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);if(n<t)n.setFullYear(n.getFullYear()+1);const days=Math.ceil((n-t)/86400000);return days===0?'Aniversario hoy':days===1?'Próximo aniversario mañana':'Próximo aniversario en '+days+' días'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderDashboard(){const g=document.getElementById('dashboardGrid'),pages=Math.max(1,Math.ceil(items.length/4));if(currentPage>=pages)currentPage=pages-1;const slice=items.slice(currentPage*4,currentPage*4+4);let h='';slice.forEach(item=>{const a=ageYMD(item.date),c=colorObj(item.color);h+=`<article class="age-card" style="--cardSoft:${c.soft}"><div class="card-top"><div class="card-icon">${item.icon||'⏳'}</div><button class="card-menu" onclick="openEditor('${item.id}')">•••</button></div><div class="card-title">${esc(item.name)}</div><div class="card-date">${esc(item.type||'Edad')} · ${fmtDate(item.date)}</div><div class="card-age"><div class="age-part"><div class="age-num">${a.years}</div><div class="age-label">Años</div></div><div class="age-part"><div class="age-num">${a.months}</div><div class="age-label">Meses</div></div><div class="age-part"><div class="age-num">${a.days}</div><div class="age-label">Días</div></div></div><div class="card-foot">${item.note?esc(item.note):nextAnniversary(item)}</div></article>`});for(let i=slice.length;i<4;i++)h+=`<button class="empty-slot" onclick="openEditor()"><div><div class="empty-plus">＋</div><div class="empty-text">Agregar contador</div></div></button>`;g.innerHTML=h;document.getElementById('pageInfo').textContent=`Página ${currentPage+1} de ${pages} · ${items.length} contador${items.length===1?'':'es'}`;document.getElementById('pageDots').innerHTML=Array.from({length:pages},(_,i)=>`<span class="pdot ${i===currentPage?'on':''}"></span>`).join('')}
function renderList(){const e=document.getElementById('itemList');e.innerHTML=items.length?items.map(item=>{const a=ageYMD(item.date),c=colorObj(item.color);return`<div class="item-row"><div class="item-icon" style="background:${c.soft}">${item.icon}</div><div class="item-main"><div class="item-name">${esc(item.name)}</div><div class="item-meta">${a.years}a ${a.months}m ${a.days}d · ${fmtDate(item.date)}</div></div><div class="item-actions"><button class="mini-btn" onclick="openEditor('${item.id}')">✎</button><button class="mini-btn" onclick="deleteItem('${item.id}')">×</button></div></div>`}).join(''):'<button class="empty-slot" style="min-height:150px;width:100%" onclick="openEditor()"><div><div class="empty-plus">＋</div><div class="empty-text">Agrega tu primer contador</div></div></button>'}function render(){renderDashboard();renderList()}function changePage(d){const p=Math.max(1,Math.ceil(items.length/4));currentPage=(currentPage+d+p)%p;renderDashboard()}function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('on'));document.getElementById('nav-'+v).classList.add('on');v==='dashboard'?renderDashboard():renderList()}
function renderPickers(){document.getElementById('iconGrid').innerHTML=ICONS.map(i=>`<button type="button" class="icon-opt ${i===selectedIcon?'on':''}" onclick="selectedIcon='${i}';renderPickers()">${i}</button>`).join('');document.getElementById('colorGrid').innerHTML=COLORS.map(c=>`<button type="button" class="color-opt ${c.id===selectedColor?'on':''}" style="background:${c.soft}" onclick="selectedColor='${c.id}';renderPickers()"></button>`).join('')}function openEditor(id){const item=id?items.find(x=>x.id===id):null;document.getElementById('editId').value=item?item.id:'';document.getElementById('sheetTitle').textContent=item?'Editar contador':'Nuevo contador';document.getElementById('itemName').value=item?item.name:'';document.getElementById('itemDate').value=item?item.date:localISO();document.getElementById('itemType').value=item?(item.type||'Edad'):'Edad';document.getElementById('itemNote').value=item?(item.note||''):'';selectedIcon=item?(item.icon||'🎂'):'🎂';selectedColor=item?(item.color||'blue'):'blue';document.getElementById('deleteBtn').style.display=item?'block':'none';renderPickers();document.getElementById('editorOverlay').classList.add('on')}function closeEditor(){document.getElementById('editorOverlay').classList.remove('on')}function saveItem(){const id=document.getElementById('editId').value,name=document.getElementById('itemName').value.trim(),date=document.getElementById('itemDate').value;if(!name)return toast('Agrega un nombre');if(!date)return toast('Selecciona una fecha');if(parseLocalDate(date)>new Date())return toast('La fecha no puede estar en el futuro');const o={id:id||uid(),name,date,type:document.getElementById('itemType').value,icon:selectedIcon,color:selectedColor,note:document.getElementById('itemNote').value.trim()};if(id){const i=items.findIndex(x=>x.id===id);if(i>=0)items[i]=o}else items.push(o);saveDisk();closeEditor();render();toast(id?'Actualizado':'Agregado')}function deleteCurrent(){const id=document.getElementById('editId').value;if(id)deleteItem(id,true)}function deleteItem(id,modal=false){const it=items.find(x=>x.id===id);if(!it)return;if(!confirm(`¿Eliminar "${it.name}"?`))return;items=items.filter(x=>x.id!==id);saveDisk();if(modal)closeEditor();render();toast('Eliminado')}let tm;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('show'),2200)}document.getElementById('editorOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditor()});let sx=0,sy=0;const touch=document.getElementById('dashboardTouch');touch.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});touch.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)changePage(dx<0?1:-1)},{passive:true});setInterval(renderDashboard,60000);load();render();
</script>
</body>
</html>
